<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SOLÈNE</title>
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      font-style: normal;
      font-weight: 500;
      src: url("fonts/f9.woff2") format("woff2");
    }
    @font-face {
      font-family: "Outfit";
      font-style: normal;
      font-weight: 400;
      src: url("fonts/f16.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F4EFE8;
      color: #1C1814;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 1200px;
      height: 630px;
      display: flex;
      background: #FBF8F4;
    }
    .lockup {
      width: 488px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 36px;
      flex: none;
    }
    .mark {
      width: 40px;
      height: 40px;
      margin-bottom: 34px;
    }
    h1 {
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-weight: 500;
      font-size: 78px;
      letter-spacing: 0.18em;
      line-height: 1;
      color: #1C1814;
      text-indent: 0.18em;
      margin-right: -0.18em;
    }
    .rule {
      width: 42px;
      height: 1px;
      background: #8A7E74;
      margin: 28px 0 22px;
    }
    p {
      font-family: "Outfit", ui-sans-serif, sans-serif;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #8A7E74;
      text-indent: 0.42em;
      margin-right: -0.42em;
    }
    .photo {
      flex: 1;
      height: 630px;
      overflow: hidden;
      border-left: 1px solid #E4DCD2;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 30% 46%;
      display: block;
    }
  </style>
</head>
<body>
  <article class="card">
    <section class="lockup">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" fill="#FBF8F4"/>
        <path fill="none" stroke="#1C1814" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
          d="M22.6 9.35c0-2.35-2.25-3.85-5.7-3.85-3.4 0-5.65 1.5-5.65 3.7 0 2.3 2.15 3.4 5.65 4.55 3.55 1.15 6 2.55 6 5.4 0 3-2.85 4.95-6.2 4.95-3.5 0-6.05-1.9-6.2-4.7"/>
      </svg>
      <h1>SOLÈNE</h1>
      <div class="rule"></div>
      <p>Quiet luxury</p>
    </section>
    <figure class="photo">
      <img src="../public/products/hero.jpg" alt="" />
    </figure>
  </article>
</body>
</html>
